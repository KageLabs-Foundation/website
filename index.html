<!DOCTYPE html>
<html lang="en" class="scroll-smooth scroll-pt-48">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kage Labs — AI-Powered SaaS Tools</title>
    <meta name="description" content="Kage Labs builds AI-powered SaaS tools for developers, students, and entrepreneurs. Intelligent copilots, analytics, and automation.">
    <meta property="og:title" content="Kage Labs">
    <meta property="og:description" content="AI-powered SaaS tools for the next generation of builders.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <script>

      (function() {
        try {
          const savedTheme = localStorage.getItem('theme');
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          

          if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          console.error('Error setting initial theme:', e);
        }
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Space Grotesk', sans-serif;
      }
      
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f4f4f5;
      }
      .dark ::-webkit-scrollbar-track {
        background: #050505;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
      
      .cursor-follower {
        transition-property: width, height, background-color, border-color, opacity;
        transition-duration: 0.15s;
        transition-timing-function: ease-out;
        will-change: transform, width, height;
      }
      
      @media (pointer: fine) {
        *, *::before, *::after {
          cursor: none !important;
        }
      }
      
      @media (pointer: coarse) {
        *, *::before, *::after {
          cursor: auto !important;
        }
        .cursor-follower {
          display: none;
        }
      }

      .text-outline {
        -webkit-text-stroke: 1px rgba(0, 0, 0, 0.2);
        color: transparent;
      }
      .dark .text-outline {
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.2);
      }
    </style>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.groq.com; img-src 'self' data:;">
</head>
  <body class="bg-zinc-50 text-zinc-900 dark:bg-[#050505] dark:text-white transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
